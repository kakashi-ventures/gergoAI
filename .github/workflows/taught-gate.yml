name: gate script vocali
on:
  pull_request:
    paths: ["bridge/taught/**", "gate/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Solo dati, valori nei limiti (non esegue i file)
        run: python -I gate/check_taught.py
